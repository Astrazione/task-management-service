services:
    task-api:
        build:
            context: .
            dockerfile: TaskManagement.Api/Dockerfile

        ports:
            - 8080:8080

        environment:
            ASPNETCORE_ENVIRONMENT: Development

            ConnectionStrings__SqlServer: >
                Server=sqlserver,1433;
                Database=TaskManagement;
                User Id=sa;
                Password=${MSSQL_SA_PASSWORD};
                Encrypt=True;
                TrustServerCertificate=True;

            Kafka__BootstrapServers: kafka:19092
            Kafka__Topic: task-events

            Grpc__TaskAuditUrl: http://task-audit:8080
        
        depends_on:
            sqlserver:
                condition: service_healthy
            
            kafka:
                condition: service_healthy
            
            task-audit:
                condition: service_started
    

    task-audit:
        build:
            context: .
            dockerfile: TaskAudit.Api/Dockerfile

        ports:
            - 8081:8080
        
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            APSNETCORE_URLS: http://+:8080

            Kestrel__EndpointDefaults__Protocols: Http2
    
    task-event-consumer:
        build:
            context: .
            dockerfile: TaskEvents.Consumer/Dockerfile

        environment:
            DOTNET_ENVIRONMENT: Development

            Kafka__BootstrapServers: kafka:19092
            Kafka__Topic: task-events
        
        depends_on:
            kafka-init:
                condition: service_completed_successfully
    

    sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest

        ports:
            - 1433:1433
        
        environment:
            ACCEPT_EULA: Y
            MSSQL_PID: Developer # Evaluation
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

        volumes:
          - sqlserver-data:/var/opt/mssql

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -No -Q 'SELECT 1' || exit 1"
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s


    kafka:
        image: apache/kafka:4.3.1

        ports:
          - 9092:9092
        
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller

            KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s


    kafka-init:
        image: apache/kafka:4.3.1

        depends_on:
            kafka:
                condition: service_healthy
        
        entrypoint:
            - /bin/sh
            - -c
            - |
                /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server kafka:19092 \
                    --create \
                    --if-not-exists \
                    --topic task-events \
                    --partitions 1 \
                    --replication-factor 1


volumes:
    sqlserver-data: